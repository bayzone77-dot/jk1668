  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #003b22;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
    }

    /* VIDEO CONTAINER */

    .video-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
      position: relative;
    }

    /* CLICKABLE VIDEO */

    .video-link {
      width: 100%;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      cursor: pointer;
      text-decoration: none;
      position: relative;

      -webkit-tap-highlight-color: transparent;
    }

    /* VIDEO DISPLAY */

    .video-link video {
      display: block;

      width: auto;
      height: auto;

      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;

      object-fit: contain;

      pointer-events: none;
    }

    /* REGISTER BUTTON */

    .register-button {
      position: absolute;

      bottom: 6%;
      left: 50%;

      transform: translateX(-50%);

      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      min-width: 210px;

      padding: 16px 28px;

      border-radius: 50px;

      background: linear-gradient(
        135deg,
        #ffe978,
        #ffb900,
        #ff8c00
      );

      border: 2px solid #fff2a0;

      color: #172d12;

      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;

      white-space: nowrap;

      box-shadow:
        0 0 15px rgba(255, 200, 0, 0.6),
        0 0 35px rgba(255, 180, 0, 0.3),
        0 5px 18px rgba(0, 0, 0, 0.3);

      animation: buttonPulse 1.8s ease-in-out infinite;

      pointer-events: none;
    }

    /* BUTTON ANIMATION */

    @keyframes buttonPulse {

      0%, 100% {
        transform:
          translateX(-50%)
          translateY(0)
          scale(1);

        box-shadow:
          0 0 15px rgba(255, 200, 0, 0.6),
          0 0 30px rgba(255, 180, 0, 0.3);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(-5px)
          scale(1.06);

        box-shadow:
          0 0 25px rgba(255, 220, 0, 0.9),
          0 0 50px rgba(255, 180, 0, 0.5);
      }
    }

    .video-link:hover .register-button {
      background: linear-gradient(
        135deg,
        #fff7a6,
        #ffd700,
        #ffaa00
      );
    }

    .video-link:focus-visible {
      outline: 3px solid #ffd700;
      outline-offset: -3px;
    }

    /* MOBILE RESPONSIVE */

    @media (max-width: 768px) {

      .video-container {
        width: 100%;
        height: 100dvh;
      }

      .video-link video {
        max-width: 100%;
        max-height: 100dvh;

        object-fit: contain;
      }

      .register-button {
        bottom: 7%;

        min-width: 190px;

        padding: 14px 24px;

        font-size: 16px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      .register-button {
        animation: none;
      }
    }

  </style>

  <!-- VIDEO AUTOPLAY SCRIPT -->

  <script>

    const video = document.getElementById("heroVideo");

    // Ensure muted playback
    video.muted = true;
    video.defaultMuted = true;

    video.setAttribute("muted", "");
    video.setAttribute("playsinline", "");

    function startVideo() {

      if (!video.paused) return;

      const playPromise = video.play();

      if (
        playPromise &&
        typeof playPromise.catch === "function"
      ) {
        playPromise.catch(error => {
          console.log(
            "Video autoplay prevented:",
            error
          );
        });
      }

    }

    // Attempt autoplay on page load
    if (document.readyState === "loading") {

      document.addEventListener(
        "DOMContentLoaded",
        startVideo
      );

    } else {

      startVideo();

    }

    // Retry when video is ready
    video.addEventListener(
      "canplay",
      startVideo,
      { once: true }
    );

    // Resume video when visitor returns
    document.addEventListener(
      "visibilitychange",
      function() {

        if (!document.hidden && video.paused) {
          startVideo();
        }

      }
    );

  </script>

  <!-- END VIDEO AUTOPLAY SCRIPT -->
